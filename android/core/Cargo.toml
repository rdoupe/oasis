[package]
name = "oasis-android"
version = "0.1.0"
edition = "2021"
description = "The Android app's bridge to the oasis client core"
license = "Apache-2.0"
publish = false

# Its own workspace: the app builds it for Android targets only, apart from the core's.
[workspace]

[lib]
name = "oasis_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
oasis_core = { package = "herdr", path = "../.." }
jni = "0.21"
serde_json = "1"
unicode-width = "0.2"
